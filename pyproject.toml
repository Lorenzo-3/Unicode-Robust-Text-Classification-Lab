[project]
name = "unicode-robust-text-classification"
version = "0.1.0"
description = "Notebook-first HWp on text-classification robustness to adversarial Unicode perturbations"
requires-python = ">=3.12,<3.13"
dependencies = [
  "accelerate>=1.10,<2",
  "datasets>=4.0,<5",
  "huggingface-hub>=0.34,<1",
  "ipykernel>=6.30,<7",
  "ipywidgets>=8.1,<9",
  "joblib>=1.5,<2",
  "jupyterlab>=4.4,<5",
  "matplotlib>=3.10,<4",
  "nbconvert>=7.16,<8",
  "numpy>=2.2,<3",
  "pandas>=2.3,<3",
  "pyarrow>=20,<23",
  "pyyaml>=6.0,<7",
  "regex>=2025.7",
  "requests>=2.32,<3",
  "scikit-learn>=1.7,<2",
  "scipy>=1.15,<2",
  "seaborn>=0.13,<1",
  "tiktoken>=0.11,<1",
  "torch>=2.7,<3",
  "transformers>=4.55,<5",
]

[tool.uv]
package = false
